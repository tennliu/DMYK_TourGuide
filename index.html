<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#910000">
  <title>Dongmen YongKang Guide</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="app-stage">
  <main class="phone-shell">
    <section id="languageScreen" class="language-screen" aria-label="Language selection">
      <img id="languageBg" class="language-bg" alt="" aria-hidden="true">
      <div class="language-header" aria-label="Dongmen YongKang District Touring Guide">
        <img class="language-brand" src="assets/Overlay_Logo.svg?v=15" alt="Dongmen YongKang">
        <div class="guide-title-zh">東門永康商圈數位導覽地圖</div>
        <div class="guide-title-en">Dongmen YongKang District Touring Guide</div>
        <div class="guide-divider"></div>
        <div class="choose-title-zh">選擇你的語言</div>
        <div class="choose-title-en">Choose Your Preferred Language</div>
      </div>
      <div class="language-grid" aria-label="Choose your language">
        <button class="lang-btn lang-cn" data-lang="zh" aria-label="中文"><img src="assets/Lang_CN.svg?v=15" alt="中文"></button>
        <button class="lang-btn lang-jp" data-lang="ja" aria-label="日本語"><img src="assets/Lang_JP.svg?v=15" alt="日本語"></button>
        <button class="lang-btn lang-en" data-lang="en" aria-label="English"><img src="assets/Lang_EN.svg?v=15" alt="English"></button>
        <button class="lang-btn lang-kr" data-lang="ko" aria-label="한국어"><img src="assets/Lang_KR.svg?v=15" alt="한국어"></button>
        <button class="lang-btn lang-th" data-lang="th" aria-label="ไทย"><img src="assets/Lang_THAI.svg?v=15" alt="ไทย"></button>
        <button class="lang-btn lang-vi" data-lang="vi" aria-label="Tiếng Việt"><img src="assets/Lang_VIET.svg?v=15" alt="Tiếng Việt"></button>
        <button class="lang-btn lang-id" data-lang="id" aria-label="Bahasa Indonesia"><img src="assets/Lang_IN.svg?v=15" alt="Bahasa Indonesia"></button>
      </div>
    </section>

    <section id="mapScreen" class="map-screen is-hidden" aria-label="Map">
      <iframe id="mapFrame" title="Dongmen YongKang Map" src="" loading="eager" allowfullscreen></iframe>
      <button id="sideBtn" class="side-btn" type="button" aria-label="Open information panel">
        <img src="assets/Side_btn.svg?v=15" alt="">
      </button>
    </section>
  </main>
  </div>

  <div id="overlay" class="overlay" aria-hidden="true">
    <img class="overlay-base" src="assets/Overlay_BG.svg?v=15" alt="" aria-hidden="true">
    <div class="overlay-inner">
      <img class="overlay-logo" src="assets/Overlay_Logo.svg?v=15" alt="Dongmen YongKang">
      <div class="overlay-content">
        <div id="overlayDescription" class="overlay-description"></div>
        <img id="decoIcon" class="deco-icon" alt="" aria-hidden="true">
        <div class="overlay-actions">
          <button id="shareBtn" class="overlay-btn" type="button">分享</button>
          <button id="languageBtn" class="overlay-btn" type="button">選擇語言</button>
          <button id="closeBtn" class="overlay-btn overlay-btn-secondary" type="button">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=15"></script>
</body>
</html>
